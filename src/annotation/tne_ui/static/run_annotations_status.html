<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script Execution Status</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            zoom: 90%;
            width: 100%;
            margin: 0;
            padding: 0;
            height: 100%;
        }

        .container {
            width: 100%;
            height: 100%;
            overflow: auto; /* Enable scrolling */
        }

        article {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 95%;
            max-width: 800px; /* Limit the width for better readability */
            background-color: #f1f1f1;
            border: 1px solid black;
            border-radius: 5px;
            margin: 10px auto; /* Center the article vertically */
            padding: 10px;
            box-sizing: border-box; /* Ensure padding is included in width calculation */
        }
    </style>
</head>
<body>
<div class="container">
    <article>
        <h2>$message</h2>
        <p id="currentTime"></p>
    </article>
</div>

<script>
    // get current datetime and display
    let dt = new Date();
    document.getElementById("currentTime").innerHTML = `Time: ${dt.toLocaleDateString()} ${dt.toLocaleTimeString()}`;
</script>
</body>
</html>
