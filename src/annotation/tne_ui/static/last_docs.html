<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last Documents Received</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            zoom: 90%;
            width: 100%;
            margin: 0;
            padding: 0;
            height: 100%;
        }

        .container {
            width: 100%;
            height: 100%;
            overflow: auto; /* Enable scrolling */
        }

        article {
            width: 95%;
            max-width: 800px; /* Limit the width for better readability */
            margin: 0 auto; /* Center the article horizontally */
            background-color: #f1f1f1;
            border: 1px solid black;
            border-radius: 5px;
            margin: 10px auto; /* Center the article vertically */
            padding: 10px;
            box-sizing: border-box; /* Ensure padding is included in width calculation */
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
<div class="container">
    <article>
        <h2>Last Documents Received</h2>
        <table id="document_table">
            <thead>
            <tr>
                <th>Date</th>
                <th>Hour</th>
                <th>Name</th>
                <th>Phase</th>
                <th>Document ID</th>
            </tr>
            </thead>
            <tbody id="document_table_body">
            <!-- JavaScript will populate this table -->
            </tbody>
        </table>
    </article>
</div>

<script>
    // Sample data (replace this with your actual data)
    var documents = $docs;

    // Function to populate the document table
    function populateDocumentTable() {
        var tableBody = document.getElementById("document_table_body");
        tableBody.innerHTML = ""; // Clear existing rows

        documents.slice(0, 20).forEach(function (doc) {
            var row = document.createElement("tr");
            row.innerHTML = `
                <td>${doc.day}</td>
                <td>${doc.hour}</td>
                <td>${doc.annotator}</td>
                <td>${doc.phase}</td>
                <td>${doc.doc_id}</td>
            `;
            tableBody.appendChild(row);
        });
    }

    // Call the function to populate the document table
    populateDocumentTable();
</script>
</body>
</html>
