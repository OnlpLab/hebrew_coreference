<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            color: #333;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        .error-message {
            color: #ff0000;
            border: 1px solid;
            padding: 20px;
            border-radius: 5px;
            background-color: #fff;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
    </style>

    <title>Document Unavailable</title>
</head>
<body>
    <h1>Hebrew Coreference Resolution Interface</h1>
    <div class="error-message">
        We apologize for the inconvenience. The document you're attempting to access ($hit_id) has not been tagged by our annotators yet.
        Check back soon, we're working on it!
    </div>
</body>
</html>
