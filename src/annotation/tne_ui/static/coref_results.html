/**
*var bridges is a list that holds bridging links created by the user.
*A bridging link can be of two types BridgeLink and  ExternalBridgeLink.
*A BridgeLink represents a bridge whose antecedent is an entity from the text;
it has an id, a "bridge" field that holds the id of the bridge (an np),
a "complement" field that holds the id of the antecedent (an entity),
a "preposition" field that holds the preposition specified by the user,
and a "type" field whose value is always "regular".
*An ExternalBridgeLink represents a bridge whose antecedent is extratextual and was specified by the user;
it has an id, a "bridge" field that holds the id of the bridge (an np),
a "complement" field that holds the string representing the extratextual antecedent,
a "preposition" field that holds the preposition specified by the user,
and a "type" field whose value is always "external".
*Only nps assigned to an entity (coref cluster) can have bridging links with entities or external nps.
*If an np is linked to an entity as a bridge, it cannot belong to the same entity,
and vice versa: if an np belongs to an entity it cannot be linked to the same entity as a bridge.*/

var bridges = []; //List[Union[BridgeLink, ExternalBridgeLink]]//BridgeLink: record[id:int, bridge:int, complement:int, preposition:string, type:string]; ExternalBridgeLink: record[id:int, bridge:int, complement:string, preposition:string, type:string]

var current_np_id = 0; //int //current_np_id is the id of the np that is currently being updated (the one that is highlighted in yellow on the screen)


//--------------Functions that update the nps--------------
//This function creates a new entity and assigns an np to the newly created entity;
//"source" is a string that specifies the reason why the np formed a new entity; it reflects the option selected by the user, for example, "new"
function form_new_entity(np_id, source) {
    try {
        checkIfNotInCluster(np_id); //check if the np does not already belong to an entity (coref cluster)
        var new_entity = {};
        new_entity["id"] = get_next_entity_id();
        new_entity["members"] = [np_id];
        new_entity["source"] = source;
        coref.push(new_entity);
    } catch (e) {
        console.log(e.name + ': ' + e.message);
    }
}

//this function updates the source field of an entity
function update_entity_source(entity_id, source) {
    var my_entity = coref.filter(entity => entity.id === entity_id)[0];
    my_entity["source"] = source;
}

//This function creates bridges (links an np to an entity)
//the argument "entity_id" the id of the entity to which the NP is linked
//the argument prep is a string that reflects the preposition that links the complement to the bridge
function link_to_entity(np_id, entity_id, prep) {
    try {
        checkIfNotSameAs(np_id, entity_id); //check if the np does not belong to the entity
        checkIfBridgingLinkExists(np_id, entity_id); //check if the link does not exist already
        var bridge = {};
        bridge["id"] = get_next_bridge_id();
        bridge["bridge"] = np_id;
        bridge["complement"] = entity_id;
        bridge["preposition"] = prep;
        bridge["type"] = "regular";
        bridges.push(bridge);
    } catch (e) {
        console.log(e.name + ': ' + e.message);
    }
}


//This function creates external bridges (links an np to an external np - one not found in the text)
//the argument "external_np" is a string
//the argument prep is a string that reflects the preposition that links the complement to the bridge
function link_to_external_np(np_id, external_np, prep) {
    var bridge = {};
    bridge["id"] = get_next_bridge_id();
    bridge["bridge"] = np_id;
    bridge["complement"] = external_np;
    bridge["preposition"] = prep;
    bridge["type"] = "external";
    bridges.push(bridge);
}


//This function deletes a bridging link between an np and an entity or an extratextual NP by removing the record of the link from the list of bridges
//"bridge_id" is the id of link to be deleted
//"complement" is the is either an int (the id of the entity from whoch the np is unlinked) or a string (reperesenting the extratextual NP from which the np is unlinked)
function delete_bridge(bridge_id) {
    var bridge_to_delete = _.find(bridges, {
        id: bridge_id
    });
    _.pull(bridges, bridge_to_delete);
}


//This function creates coref links
function add_coref_np_to_entity(np_id, entity_id) {
    try {
        //check if the np has not bridge or member-set links with the entity or does not already belong to another entity
        checkIfNotInCluster(np_id); //check if the np does not already belong to an entity (coref cluster)
        checkIfNotLinkedTo(np_id, entity_id);
        var my_entity = coref.filter(entity => entity.id == entity_id)[0];
        my_entity["members"].push(np_id);
    } catch (e) {
        console.log(e.name + ': ' + e.message);
    }
}

function delete_coref_link(np_id, entity_id) {
    var my_entity = coref.filter(entity => entity.id == entity_id)[0];
    _.pull(my_entity.members, np_id);
    //if the entity has no members anymore, remove the entity from coref
    if (my_entity.members.length == 0) {
        _.pull(coref, my_entity);
    }
}

function get_current_np() {
    var current_np = nps[current_np_id];

function get_current_np_id() {

//It is executed when the user finishes updating an np and goes to a new one
function set_current_np(num) {
    current_np_id = num;
    return current_np_id;
}

//This function returns the id of the np that becomes "current" when "Next" is clicked;
//It allows the user to go through the nps in the order in which they appear in the text
//Todo: has to be expanded to take the "return to it later" property into consideration.
function get_next_np_id() {
    var visited_nps = get_visited_nps();
	
    for (var i = 0; i < nps.length; i++) {
        if (!visited_nps.includes(i)) {
            return i;
            break;
        }
    }
    //This part is executed if the first passage through the text is complete (all the nps have been assigned to coref clusters) and the nps that are marked as " not done" have to be revisited
    for (var i = 0; i < nps.length; i++) {
        if (!done_nps[i]) {
            return i;
            break;
        }
    }
    return null; //the task is complete
}


//This function returns the id to be assigned to a newly created entity
function get_next_entity_id() {
    var my_last_entity = _.maxBy(coref, 'id')
    if (my_last_entity != undefined) {
        var next_entity_id = my_last_entity.id + 1;
        return next_entity_id;
    }
    return 0;
}

//This function returns the id to be assigned to a newly created bridging link
function get_next_bridge_id() {
    var my_last_bridge = _.maxBy(bridges, 'id');
    if (my_last_bridge != undefined) {
        var next_bridge_id = my_last_bridge.id + 1;
        return next_bridge_id;
    }
    return 0;
}


//This function returns a list of ids of visited nps (nps that have already been assigned to a coref cluster, or entity)
function get_visited_nps() {
    var visited_nps = [];
    for (var i = 0; i < coref.length; i++) {
        visited_nps = visited_nps.concat(coref[i]["members"]);
    }
    return visited_nps;
}

//This function serves to present to the user the next np in the text; it is executed when "Next" is clicked
function go_to_next_np() {
    current_np_id = get_next_np_id();
    return current_np_id;
}


//This function marks an np as "done" or "not done"
//An np should be marked as done whenever the annotation of an np is finished and the "return to this later" option is not checked.
//An np shpuld be marked as "not done" again, whenever a scratch out idtem on the item pane is clicked.
function mark_done(np_id, isDone = true) {
    done_nps[np_id] = isDone;
}


//--------------Functions that return lists/dictionaries to reflect the current state of the annotation--------------

//This function returns the current state of an np
function show_np_status(np_id) {
    var my_np = nps.filter(np => np.id == np_id)[0];
    var np_to_show = my_np;
    if (get_visited_nps().includes(np_id)) {
        //coref
        var entity = coref.filter(entity => entity.members.includes(np_id))[0];
        var entity_id = entity["id"];
        np_to_show["belongs_to_entity"] = entity_id;

        //label from the coref stage
        //if this np formed a new entity, the label is the source of the entity; otherwise - "same as..."
        var label = (entity.members[0] == np_id ? entity.source : 'same as...');
        np_to_show["label"] = label;

        //bridges
        var my_bridges = bridges.filter(lnk => lnk.bridge == np_id);
        if (my_bridges.length > 0) {
            np_to_show["linked_to_entities"] = []; //bridges
            for (var i = 0; i < my_bridges.length; i++) {
                np_to_show["linked_to_entities"].push(my_bridges[i]["complement"]);
            }
        }
    }
    return (np_to_show);
}


//This function returns a list of nps with "idiomatic" and "time/date/measurement" removed
function get_nps_for_bridging_stage() {
    var filtered_nps = nps.filter(np => (!(["idiomatic", "time/date/measurement expression"].includes(show_np_status(np.id)["label"]) || pronouns.includes(np.id))));
    return filtered_nps;
}


//This function returns a list of all the nps with currently existing annotations
function annotation_status() {
    annotations = [];
    for (var i = 0; i < nps.length; i++) {
        annotations.push(show_np_status(nps[i]["id"]));
    }
    return (annotations);
}


//--------------Invariants an checks--------------

//This function checks if np a belongs to coref cluster (entity) b;
//It is used when forming bridging links to check if an np is not being linked to its own cluster;
//Throws an error if a belongs to b
function checkIfNotSameAs(a, b) {
    var my_entity = coref.filter(entity => entity.members.includes(a))[0];
    var my_entity_id = -1;
    if (my_entity != undefined) {
        var my_entity_id = my_entity["id"];
    }
    if (my_entity_id == b) {
        throw new Error('An np that belongs to an entity, cannot form a bridging or member-set link with the same entity');
    }
}

//This function checks if np a is linked to coref cluster (entity) b as a bridge;
//It is used when assigning an np to a coref cluster (entity);
//Throws an error if a is linked to b;
function checkIfNotLinkedTo(a, b) {
    var my_links = bridges.filter(lnk => lnk.bridge == a);
    var my_link = my_links.filter(lnk => lnk.complement == b);
    if (my_link.length > 0) { //a is linked to b as a bridge
        throw new Error('An np that is linked to an entity as a bridge, cannot be assigned to the same entity');
    }
}


//This function checks if np already belongs to a coref cluster (entity);
//It is used when assigning an np to a coref cluster (entity), a new one or an existing one.
//Throws an error if the np already belongs to another coref cluster;
function checkIfNotInCluster(np_id) {
    var my_entity = coref.filter(entity => entity.members.includes(np_id))[0];
    if (my_entity != undefined) {
        throw new Error('An np that belongs to an entity, cannot be assigned to an entity again');
    }
}

//This function checks if a bridging link already exists;
//It is used when creating new bridging links;
//Throws an error if a link with "bridge" a, and "complement" b already exists;
function checkIfBridgingLinkExists(a, b) {
    var my_link = bridges.filter(lnk => (lnk.bridge == a && lnk.complement == b));
    if (my_link.length > 0) { //a link between a and b alredy exists
        throw new Error('A bridging link between this np and this complement already exists,');
    }
}

      <script>
         // this function renders the HTML of the main textbox
         function f_render_text(nps, text, entities, cid, screen, bridge_candidates, mode) {
             // this renders the text based on the nps, the text, and the current np id.					 
             var chars = text.raw_text.split('');
             					 
             nps.forEach(np => {
                 var my_entity = entities.filter(entity => entity.members.includes(np.id))[0];
                 
                 if (np.id == cid){
				 if(mode == "regular") {
                     chars[np.start_index] = `<span id='cur_NP'>` + chars[np.start_index];
					 } else {
					chars[np.start_index] = "<span id = 'np" + np.id +`' style = "background-color:yellow;">` + chars[np.start_index]; 
				}
                 } else {
                     if (my_entity != undefined) {
                         if (screen != "regular" && bridge_candidates.includes(np.id)) {
                             chars[np.start_index] = "<span id = 'np" + np.id +"' class = 'bridge_candidate entity" + my_entity.id + "'>" + chars[np.start_index];
                         } else {
                             chars[np.start_index] = "<span id = 'np" + np.id +"' class = 'entity" + my_entity.id + "'>" + chars[np.start_index];
                         }
                     } else {
                         chars[np.start_index] = `"<span id = 'np" + np.id +"'">` + chars[np.start_index];
                     }
                 }
                 chars[np.end_index - 1] = chars[np.end_index - 1] + "</span>";
             });
             //title
			if (text.title.start_index < text.title.end_index){	//if there is a title
             chars[text.title.start_index] = `<h2>` + chars[text.title.start_index];
             chars[text.title.end_index - 1] = chars[text.title.end_index - 1] + "</h2>";
			 }
             //subtitles			 
             text.subtitles.forEach(subtitle => {
			     if (subtitle.start_index < subtitle.end_index){//if there is a subtitle
                 chars[subtitle.start_index] = `<h3>` + chars[subtitle.start_index];
                 chars[subtitle.end_index - 1] = chars[subtitle.end_index - 1] + "</h3>";
				 }
             });
             //paragraphs
			 <!-- p_counter = 0 -->
             text.paragraphs.forEach((paragraph, index) => {
			    if (!'indents' in text){
                 chars[paragraph.start_index] = `<p>` + chars[paragraph.start_index];
				 } else if ('indents' in text){
				 chars[paragraph.start_index] = '<p style="margin-left: ' + text.indents[index]*20 +'px"><b>' + chars[paragraph.start_index]; 
				 chars[paragraph.start_index + text.paragraph_authors[index].length] = chars[paragraph.start_index + text.paragraph_authors[index].length] + '</b>';
				 }
                 chars[paragraph.end_index - 1] = chars[paragraph.end_index - 1] + "</p>";
				 <!-- p_counter = p_counter+1 -->
             });
             
             return chars.join("")
         };
         
         //this function returns the text of an np
         function f_np_text_from_id(np_id) {
             np = nps.filter(np => np.id == np_id)[0];
             return np.text;
         };
         
         //this function checks if an entity includes current np
         function f_entity_includes_current(entity) {
         var current = get_current_np_id();			
             if(entity.members.includes(current)){
         return true;
         }
             return false;
         };
         
         //this function merges similar texts of members of the same cluster (filters dupliate np texts)
         function f_merge_entity_members(entity){
         var merged_members = [];
         entity.members.forEach(member => {
         var txt = nps[member].text;
         if (!merged_members.map(m => nps[m].text).includes(txt)) {
         merged_members.push(member);				}
         });	
         return merged_members;				
         }
         
         
         <!-- UI functions that call the core code -->		 
		 
         //This function takes the user to the next NP: highlights the next np in the text and updates the option pane acordingly
         function ui_go_to_next_np() {
             var np_id = go_to_next_np();
             
             if (np_id == null) {
                 if (CURRENT_STAGE == 'coref') {
                     if (confirm('You are about to go to finish. Are you sure your coref clusters are correct? If not, click "Cancel" and revise them.')) {
                         showFinalScreen();
                     } else {
                         return;
                     }
         
                 } else {
         
         showFinalScreen();
                     
                 }
             } else {
                 _text.set({
                     'current': np_id,
                 });
         
         _item_pane.set({
                     'current_np_id': np_id,
                 });
         
                 update_options();	
                 
         
         scrollElementIntoView('current_item');
         scrollElementIntoView('cur_NP');
             }
         }

         //hide all the container divs
         w3.hide('.container');	
		 
		
         //set data for final screen
         _final_screen.set({
                     'crf_clusters': JSON.stringify(coref),
         'states': JSON.stringify(STATES),
         'displayed':true,
                 });
         }				
         
         
         //This function takes the user to bridging stage when coref stage is finished
         function go_to_bridging_stage() {
             //change style            
         changeStyle('#mid_r','bottom','20%');
         changeStyle('#bottom_r','top','80%');
		 changeStyle('#mid_l','bottom','20%');
         changeStyle('#bottom_l','top','80%');
         changeStyle('#entity_pane','height','80%'); 
		 changeStyle('#options_pane','height','85%'); 
         
             set_current_np(0);
             CURRENT_STAGE = 'bridging';
			 
			 			
			//get nps for bridging stage
             var filtered_nps = get_nps_for_bridging_stage();
             filtered_nps.forEach((np) => {
                 mark_done(np.id, false);
             });
             _options.set({
                 'stage': CURRENT_STAGE,
                 'pronouns': pronouns,
             });
             _links.set({
                 'stage': CURRENT_STAGE,
                 'pronouns': pronouns,
                 'stage': CURRENT_STAGE,
             });
             _entity_pane.set({
                 'pronouns': pronouns,
                 'stage': CURRENT_STAGE,
             });
         
             _item_pane.set({
                 'stage': CURRENT_STAGE,
                 'done_items': done_nps,
                 'nps': filtered_nps,
         'current_np_id': 0,
             });
             _text.set({
                 'current': 0,
                 'nps': nps,
             });
             update_options();
         }
         
         
         //This function is executed when an item is clicked on the item pane.
         //The clicked item is highlighted in the text. If the clicked item was "done" (scratched out), it becomes "not done" again.
         function go_to_np(np_id) {		    
             var new_current = set_current_np(np_id);
             
             _text.set({
                 'current': new_current
             });
         
         _item_pane.set({                
         'current_np_id': new_current,
             });
         
             <!-- update_options(); -->
             mark_done(new_current, false);
             update_item_pane();
         try{
         scrollElementIntoView('cur_NP');
		 } catch {
		 scrollElementIntoView('np'+np.id);
		 }
         }
         
         function update_entity_pane() {
             var entities = coref;
             _entity_pane.set({
                 'entities': entities
             })
         }
         
         //This function updates the item pane
         function update_item_pane() {
             var done_items = done_nps;
             _item_pane.set({
                 'done_items': done_items
             })
         }
         
         //This function updates "my links" section
         function update_links() {
             var links = bridges;
             _links.set({
                 'bridges': links,
             })
         }
         
         
         //This function updates the option pane
         function update_options() {
             var np_id = get_current_np_id();
             if (np_id == null) {
                 return;
             }
             var current_np_text = nps[np_id].text;
             var entities = coref;
             for (var j = 0; j < entities.length; j++) {
                 entities[j].selected_preposition = "of";
             }
             _options.set({
                 'current_np_text': current_np_text,
                 'entities': entities,
                 'bridge_candidates': [],
                 'merged_cands': [],
         
                 'state': {
                     selected_coref_option: (entities.length > 0 ? "same as...":null),
                     selected_crf: null,
                     selected_bridges: [],
                     external_complement: '',
                     external_preposition: 'of',
                 }
             });
         
             var visited_nps = get_visited_nps();
             if ((CURRENT_STAGE == "coref" && visited_nps.includes(np_id)) || (CURRENT_STAGE == "bridging" && STATES[np_id]["selected_bridges"].length > 0)) {
                 var current_state = {};

				}

                     'state': current_state,

                 //at bridging stage, get the prepositions from the STATES variable as well

         //This function returns the entity to which the np belongs
         function get_entity(np_id) {
             var entity = coref.filter(entity => entity.members.includes(np_id))[0];
             return entity;
         }

         function ui_new_entity(np_id, source) {
             form_new_entity(np_id, source);
             <!-- update_entity_pane(); -->
             mark_done(np_id);
             <!-- update_item_pane(); -->
             <!-- ui_go_to_next_np(); -->
         }
         
         
         
         //This function assigns the np to an existing cluster
         function ui_same_as(np_id, cluster_id) {
             add_coref_np_to_entity(np_id, cluster_id);
             <!-- update_entity_pane(); -->
             mark_done(np_id);
             <!-- update_item_pane(); -->
             <!-- ui_go_to_next_np(); -->
         }
         
         //This function creates regular bridges
         function ui_link_to_entities(np_id, cluster_ids) {
             for (var j = 0; j < cluster_ids.length; j++) {
                 var prepId = "addPrep" + cluster_ids[j];
                 var prep = _options.get('entities').filter(entity => entity.id == cluster_ids[j])[0]["selected_preposition"];
                 link_to_entity(np_id, cluster_ids[j], prep);
             }
             mark_done(np_id);
         }
         
         //This function creates external bridges		
         function ui_link_to_external_np(np_id, external_np, prep) {
             link_to_external_np(np_id, external_np, prep);
             mark_done(np_id);
         }
         
         //This function deletes all the bridges of an np
         function ui_delete_bridges(np_id) {
             var my_bridges = bridges.filter(link => link.bridge == np_id);
             for (var j = 0; j < my_bridges.length; j++) {
                 delete_bridge(my_bridges[j].id);
             }
         }
         
         
         
         //This function updates coref and bridges data structures based on the _options state
         function data_from_model(np_id) {
             var selected_coref_option = _options.get('state.selected_coref_option');
             
             var selected_crf = _options.get('state.selected_crf');
             var selected_bridges = _options.get('state.selected_bridges');
             var external_complement = _options.get('state.external_complement');
             var external_preposition = _options.get('state.external_preposition');
             if (CURRENT_STAGE == "coref") {
                 if (get_visited_nps().includes(np_id) && (STATES[np_id] != _options.get("state"))) { //if the user is revisiting, delete previous answers					
                     var old_entity_id = get_entity(np_id).id;
                     delete_coref_link(np_id, old_entity_id);
                     mark_done(np_id, false);
                     delete STATES[np_id];
                 }
         
                 if (selected_coref_option == "same as...") { //coref is selected                    
                     ui_same_as(np_id, selected_crf);
                 } else { //an option creating a new entity is selected
                     ui_new_entity(np_id, selected_coref_option);
                 }
         
             } else { //bridging stage
                 //"none of the above" is selected - just mark the np as done; if it's being revisited - remove all the bridges and member-of links
                 if (selected_bridges[0] == "noBridge") {
                     mark_done(np_id);
                     ui_delete_bridges(np_id);
         
                 } else {
                     //bridging is selected
         
                     //check if the user is not trying to link the np to its own entity
                     for (var j = 0; j < selected_bridges.length; j++) {
                         try {
                             checkIfNotSameAs(np_id, selected_bridges[j]); //check if the np does not belong to the entity
                         } catch (e) {
                             console.log(e.name + ': ' + e.message);
                             alert("You cannot link an expression to its own coref group.");
                             return;
                         }
                     }
                     //if the np is being revisited, delete former bridges
                     ui_delete_bridges(np_id);
                     //select internal bridges
                     var internal_complements = selected_bridges.filter(bridge => bridge != "external");
                     //create bridges
                     ui_link_to_entities(np_id, internal_complements);
                     //if external bridge is checked
                     if (selected_bridges.includes("external")) {
                         ui_link_to_external_np(np_id, external_complement, external_preposition);
                     }
         
                 }
             }
         
         }
         
         //This function returns true if at least one valid option is selected
         function optionSelected() {
             var selected_coref_option = _options.get('state.selected_coref_option');
             var selected_crf = _options.get('state.selected_crf');
             var selected_bridges = _options.get('state.selected_bridges');
             var external_complement = _options.get('state.external_complement');
         
         
             if (CURRENT_STAGE == "coref") {			
                 if (selected_coref_option == null) {
                     alert("Please, select an option!");
                     return false;
                 } else if (selected_coref_option == "same as...") { //if coref is selected, check if an antecedent has been selected				
                     if (selected_crf == null) {
                         alert("Select an option from the \"same as...\" section.");
                         return false;
                     }
                 }
                 return true
             } else { //bridging stage				
                 if (selected_bridges.length == 0) {
                     alert("Please, select an option!");
                     return false;
                 } else { //check if any of the selected options require an antecedent; if so, check if and antecedent has been selected		                 
                     if (selected_bridges.includes("external") && external_complement.trim() == '') {
                         alert("Please, specify a complement in the textbox."); //If external complement is selected, the textbox cannot be empty
                         return false;
                     }
         
                     //check if the user is not trying to link the np to its own entity
                     for (var j = 0; j < selected_bridges.length; j++) {
                         try {
                             checkIfNotSameAs(get_current_np_id(), selected_bridges[j]); //check if the np does not belong to the entity
                         } catch (e) {
                             console.log(e.name + ': ' + e.message);
                             alert("You cannot link an expression to its own coref group.");
                             return false;
                         }
                     }
                 }
                 return true;
             }
         }
         
         
         //This function is executed when the "Next" button is clicked    
         function doNext() {
             if (!optionSelected()) {
                 return;
             }
             if (CURRENT_STAGE == "bridging" && _options.get("state.selected_bridges")[0] != "noBridge") { //if bridging is selected				 
                 applyBridgesToCluster();
             } else {
                 showNextExpression();
             }
         var divId = (CURRENT_STAGE == "coref"  ? "coref_options" : "options");			
         scrollSectionUp(divId);	
         scrollSectionUp("entity_pane");	
         }
         
         //This function takes the user to the next np in question
         function showNextExpression() {
         
             var np_id = get_current_np_id();
             if (np_id != null) {
                 data_from_model(np_id);
         
                 //save the "state" field of the _options variable					
                 STATES[np_id] = _options.get('state');
                 //at bridging stage, also save prepositions
                 if (CURRENT_STAGE == "bridging") {
                     var preps = _options.get('entities').map(entity => entity.selected_preposition);
                     STATES[np_id]["preps"] = preps;
                 }
         
                 //update screen
                 update_item_pane();
                 update_entity_pane();
                 update_links();
             }
             ui_go_to_next_np();
         }
         
         
         //This function asks the user if the bridges selected for an np can be applied to the whole coref cluster to which the np belongs
         function applyBridgesToCluster() {
             //get current np id
             var np_id = get_current_np_id();
             //get the entity of the current np
             var cur_entity = get_entity(np_id);
             if (cur_entity.members.length > 1) { //do bridge expansion if the entity members include other NPs besides the current one
                 
                 //switch SCREEN to "bridge_expansion"
                 toggle_screen();
                 //update _options			 
                 var antecedents = _options.get('entities').filter(entity => _options.get('state.selected_bridges').includes(entity.id));
                 var bridge_candidates = cur_entity.members.filter(member => !(member == np_id || pronouns.includes(member)));
                 //merge bridge candidates with similar text
                 var bridge_cands_merged = {};
                 bridge_candidates.forEach(cand => {
                     cand_np = nps[cand];
                     if (cand_np.text in bridge_cands_merged) {
                         bridge_cands_merged[cand_np.text].push(cand);
                     } else {
                         bridge_cands_merged[cand_np.text] = [cand];
                     }
                 });
         
                 var merged_cands = [...new Array(antecedents.length + _options.get('state.selected_bridges').includes("external"))].map(() => Object.keys(bridge_cands_merged).filter(cand => cand != nps[np_id].text));
         
                 _options.set({
                     'antecedents': antecedents,
                     'bridge_candidates': bridge_candidates,
                     'merged_cands': merged_cands,
         'merged_cands_for_reference': merged_cands,
                 });
         
                 //update _text
         
                 _text.set({
                     'bridge_candidates': bridge_candidates,
                 });
         
                 if (merged_cands[0].length == 0) { //if all the members of the cluster of the current NP are identical in text, all of them are automatically linked to the same antecedent;
                     createLinks();
                 }
         
             } else { //if the entity members only include current NP, go to next expressio right away
                 showNextExpression();
             }
         }
         
         //This function removes an np from the list of nps to which bridges should be applied when doing bridge expansion
         function undo_bridge_expansion(np_id) {
             var bridge_candidates = _text.get('bridge_candidates').filter(cand => cand !== np_id);
             _text.set({
                 'bridge_candidates': bridge_candidates,
             });
         }
         
         //This function removes nps with a certain text from the list of nps to which bridges should be applied when doing bridge expansion
         function undo_bridge_expansion(txt, idx) {
             var merged_cands = _options.get('merged_cands');
             merged_cands[idx] = merged_cands[idx].filter(cand => cand !== txt);
             _options.set({
                 'merged_cands': merged_cands,
             });
         }
         
         
         
         //This function applies the bridges of an np to other nps
         function createLinks() {
             //get ids of the bridges
             var bridge_candidates = _text.get('bridge_candidates');
             //get ids of the complements
             var selected_bridges = _options.get('state.selected_bridges');
             //select internal and external bridges
         
             var external_complement = selected_bridges.filter(bridge => bridge == "external")[0];
             var antecedents = _options.get('antecedents');
             var merged_cands = _options.get('merged_cands');
         
             //create links
             for (var i = 0; i < antecedents.length; i++) {
                 for (var j = 0; j < bridge_candidates.length; j++) {
         
                     var np_id = bridge_candidates[j];
                     //check if the link between this bridge candidateand this antecedent was not removed by the user
                     if ((merged_cands[i].includes(nps[np_id].text)) || (nps[np_id].text == nps[get_current_np_id()].text)) {
                         //create bridges
                         ui_link_to_entities(np_id, [antecedents[i].id]);
                         //update STATES
                         update_state(np_id);
                     }
                 }
             }
             //if external bridge is checked
             if (external_complement != undefined) {
                 for (var j = 0; j < bridge_candidates.length; j++) {
                     var np_id = bridge_candidates[j];
                     //check if the link between this bridge candidateand this antecedent was not removed by the user
                     if (merged_cands[antecedents.length].includes(nps[np_id].text) && STATES[np_id]['external_complement'].trim() == '') {
                         //create bridges
                         ui_link_to_external_np(np_id, _options.get('state.external_complement'), _options.get('state.external_preposition'));
                         //update STATES
                         update_state(np_id);
                     }
                 }
         
             }
             //update STATES
         
         
         
             toggle_screen();
             //go to next expression
             showNextExpression();
         
         }
         
         
         function update_state(np_id) {
         
             //get new values
             var my_bridges = bridges.filter(lnk => lnk.bridge == np_id);
             var regular_bridges = my_bridges.filter(lnk => lnk.type == "regular")
             var selected_bridges_new = regular_bridges.map(bridge => bridge.complement);
             var preps_new = Array(coref.length).fill("of");
             for (var i = 0; i < regular_bridges.length; i++) {
                 preps_new[regular_bridges[i].complement] = regular_bridges[i].preposition;
             }
             //update
         
             STATES[np_id]['selected_bridges'] = selected_bridges_new;
             STATES[np_id]['preps'] = preps_new;
         
             var external_bridge = my_bridges.filter(lnk => lnk.type == "external")[0];
             if (external_bridge != undefined && STATES[np_id]['external_complement'].trim() == '') {
                 STATES[np_id]['selected_bridges'].push("external");
                 STATES[np_id]['external_complement'] = external_bridge.complement;
                 STATES[np_id]['external_preposition'] = external_bridge.preposition;
             }
         
         
         }
         
         
         
         
         
         function toggle_screen() {
             var screen = (CURRENT_SCREEN == 'regular' ? 'bridge_expansion' : 'regular');
             CURRENT_SCREEN = screen;
             _options.set({
                 screen: CURRENT_SCREEN,
             });
             _text.set({
                 screen: CURRENT_SCREEN,
             });
             _button.set({
                 screen: CURRENT_SCREEN,
             });
             (entity_listener.isSilenced() ? entity_listener.resume() : entity_listener.silence());
             (item_listener.isSilenced() ? item_listener.resume() : item_listener.silence());
             (entity_listener.isSilenced() ? entity_listener.resume() : entity_listener.silence());
             (links_listener.isSilenced() ? links_listener.resume() : links_listener.silence());
         }

             ev.dataTransfer.setData("array", [entity_id, member]);
             console.log(ev.dataTransfer.getData("array"));

         <!-- shortcuts -->
         
         var pressed = [];
         document.onkeydown = function(e) {	
         
         if(e.which == 13 || e.shiftKey) 
         pressed.push(e.which);
         
         
         };
         
         document.onkeyup = function(e) {
         
         if (pressed.includes(16)){//Shift was held
         if (e.which == 16){//the key released is shift
         if (CURRENT_SCREEN != "regular"){//if applying bridges to clusters is being performed, clear"pressed" and return
         pressed = [];
         return;
         }		
         var option = "";
         pressed.forEach(key => {
           if(key != 16) {//leave out "shift"
         if (key >=48 && key <=57){//shift+digits have been pressed
         option = option+(key-48);
         } else if (key >=65 && key <=68 && pressed.length == 2 && CURRENT_STAGE == "coref"){//shift + a letter between a and d have been pressed
         option = OPTIONS[key - 65];	
                          
         }
         }
                });
         apply_shortcut(option);	
         
         pressed = [];	//clear pressed if shift has been released
         } else {
         return;
         }
         } else if (e.which == 13 && pressed.length == 1){//Enter was pressed 
         if (CURRENT_SCREEN == 'regular') {
         //prevent hitting Enter twice by mistale
         if(CURRENT_STAGE == "coref" && _options.get('state.selected_coref_option') == "same as..." && _options.get('state.selected_crf') == null) { //if coref is selected, check if an antecedent has been selected				
                     return;
         } else if (CURRENT_STAGE == "bridging" &&  _options.get('state.selected_bridges').length == 0) {
         return;
         }
             doNext();
         } else {
             createLinks();
         }
         pressed = [];	//clear pressed
         } else {
         pressed = [];
         }
         }
         
         function apply_shortcut(option){
         
         if(option == ""){
         return;
         } else if (option == "same as..." && _options.get("entities").length == 0){//"same as..." has been selected while being disabled
         return;
         } else if (OPTIONS.includes(option)){//an "outer" crf option has been selected		
         _options.set({'state.selected_coref_option': option,});
         if(option != "same as..."){
         _options.set({'state.selected_crf': null,});
         }
         scrollElementIntoView("opt"+OPTIONS.indexOf(option));	
         } else if (_options.get("entities").length < option){//option is irrelevant		
         return;
         } else if (CURRENT_STAGE == "coref"){
         var selected_crf = coref[option-1].id;	
         _options.set({
         'state.selected_coref_option': "same as...",
         'state.selected_crf': selected_crf,
         });
         scrollElementIntoView("coref"+selected_crf);
         
         } else if (CURRENT_STAGE == "bridging"){ 
         if (f_entity_includes_current(coref[option-1])){
         return;
         }
         var selected_bridges = _options.get('state.selected_bridges');
         var selected_bridge = coref[option-1].id;	
         selected_bridges.push(selected_bridge);
         _options.set({'state.selected_bridges': selected_bridges,});
         
         scrollElementIntoView("bridge"+selected_bridge);
         
         }
         }
         
        function get_union(np_id){		
		var results = RESULTS;
		var union = [];
		results.forEach(res => {
           var entities = res.clusters;
		   var entity = entities.filter(entity => entity.members.includes(np_id))[0];
		   var members = entity.members;		   
		   members.forEach(member =>{
		   if (!union.includes(member)){
		   union.push(member);
		   }
		   });		   
                });		
		return union;
		}
		
		function get_intersection(np_id){
		var results = RESULTS;
		var intersection = get_union(np_id);		
		results.forEach(res => {
           var entities = res.clusters;
		   var entity = entities.filter(entity => entity.members.includes(np_id))[0];
		   var members = entity.members;		   
		   intersection = intersection.filter(x => members.includes(x));	   
                });		
		return intersection;
		}
		
		function get_complement(np_id){
		var union = get_union(np_id);
		var intersection = get_intersection(np_id);
		var complement = union.filter(x => (!intersection.includes(x)));
		return complement;		
		}
		
		function get_unions (nps) {
		var unions = [];
		nps.forEach(np => {
           var union = get_union(np.id);
		   var intersection = get_intersection(np.id);
		   var complement = get_complement(np.id);
		   var rec = {};
		   rec["id"] = np.id;
		   rec["union"] = union;
		   rec["intersection"] = intersection;
		   rec["complement"] = complement;
		   unions.push(rec)
                });		
		   return unions;	
		}
